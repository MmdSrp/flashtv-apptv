name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Download Vazirmatn font
        run: |
          mkdir -p app/src/main/assets/fonts
          B=https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf
          curl -fL -o app/src/main/assets/fonts/Vazirmatn-Regular.ttf $B/Vazirmatn-Regular.ttf && \
          curl -fL -o app/src/main/assets/fonts/Vazirmatn-Bold.ttf $B/Vazirmatn-Bold.ttf || rm -f app/src/main/assets/fonts/*
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk FlashTV.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Flash Player v${{ github.run_number }}
          files: FlashTV.apk
